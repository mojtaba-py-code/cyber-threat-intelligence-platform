# Reverse proxy for the Threat Intel Platform API.
upstream tip_api { server api:8000; }

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
# Streams are long-lived, so they are limited by how often a client may *open*
# one, not by request rate. Without this an SSE client could hold open as many
# hour-long connections as it liked, since /api/v1/stream/ sits outside the
# general limit.
limit_req_zone $binary_remote_addr zone=stream_limit:10m rate=1r/s;

# A throttled caller gets the same status the application uses for its own
# limiter; nginx's default 503 would say "outage" for what is really "slow down".
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # The application sets these on every response. nginx re-asserts them so
    # that responses nginx itself generates (its own 4xx/5xx pages, a rejected
    # request that never reaches the app) carry them too — but the upstream
    # copies are dropped first, or every proxied response would carry two of
    # each, and a duplicated X-Frame-Options is ignored by some browsers.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Must stay above the API's own document limit (128 KB plus JSON overhead),
    # or a legitimate bulk import is rejected here with a 413 before the API
    # ever gets to explain why.
    client_max_body_size 1m;

    # Exact match, so only the probe itself skips the access log and the rate
    # limit — a prefix match would also exempt anything merely starting with
    # this path.
    location = /api/v1/health {
        proxy_pass http://tip_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Server-Sent Events: the connection is long-lived and must not be buffered.
    # HTTP/1.1 with an empty Connection header is what keeps it streaming; the
    # read timeout only needs to outlast the API's 15s heartbeat.
    location /api/v1/stream/ {
        limit_req zone=stream_limit burst=5 nodelay;
        proxy_pass http://tip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://tip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- Production TLS termination ---------------------------------------------

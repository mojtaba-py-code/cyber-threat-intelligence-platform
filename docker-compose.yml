# The database and cache are reachable only over the internal compose network.
# Publishing them would expose a database — and an unauthenticated Redis, which
# is a full host compromise — to every interface of the Docker host. To inspect
# them locally, run `docker compose exec db psql` or add a port mapping bound to
# 127.0.0.1 in a compose override file you do not commit.
services:
  db:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-threatintel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tip} -d ${POSTGRES_DB:-threatintel}"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "5432"

  redis:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    expose:
      - "6379"

  api:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    build: .
    # The app creates tables automatically only outside production, so the
    # schema has to come from migrations here. Running them before the server
    # starts keeps a fresh stack — and every later deploy — in step with the
    # models; `exec` hands PID 1 to uvicorn so signals still reach it.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-threatintel}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Nginx is the only entry point; bind to loopback so the API cannot be
    # reached directly, bypassing the proxy's rate limiting and TLS.
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    build: .
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "--loglevel=info"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-threatintel}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    build: .
    command: ["celery", "-A", "app.workers.celery_app.celery", "beat", "--loglevel=info"]
    env_file: .env
    environment:
      # Beat only schedules, but it imports the application, and the DSN in
      # .env points at localhost — which inside this container is the container
      # itself. Override it here like every other service.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-threatintel}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:

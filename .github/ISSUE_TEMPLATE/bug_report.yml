name: Bug report
description: Something behaves differently from what the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        **Not for security vulnerabilities.** If you have found a flaw in the
        SSRF guard, the auth layer or the encryption, report it privately —
        see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I imported a STIX 2.1 bundle with 500 indicators. 480 were created, and
        the other 20 came back as duplicates although their values differ only
        in case.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: >
        The smallest request or snippet that shows the problem. Please defang
        any real indicator values (`hxxp://evil[.]com`).
      render: shell
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Indicator parsing / refang / defang
        - Collectors and enrichment
        - Scoring
        - Correlation and campaigns
        - STIX / MISP sharing
        - REST API / SSE stream
        - Dashboard
        - Auth, SSRF guard, or other security control
        - Deployment (Docker, Alembic, Celery)
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA.
    validations:
      required: true

  - type: input
    id: mode
    attributes:
      label: Live collectors
      description: Is `ENABLE_LIVE_COLLECTORS` on or off?
      placeholder: "off (default)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >
        Traceback or log output. Structured logs mask secrets already, but
        please double-check before pasting.
      render: shell
